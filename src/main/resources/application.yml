spring:
  application:
    name: payment-service

  datasource:
    # Prefer Heroku-provided JDBC vars, then DATABASE_URL, else local defaults
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/paymentdb}}
    username: ${JDBC_DATABASE_USERNAME:${DATABASE_USERNAME:payment_user}}
    password: ${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:payment_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool configuration for handling concurrent requests
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}  # Can be set to 'update' temporarily for migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}  # Set to 'always' for first run, then 'never'
      continue-on-error: true  # Continue even if some statements fail (e.g., tables already exist)
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8081}            # Heroku injects PORT at runtime

razorpay:
  keyId: ${RAZORPAY_KEY_ID:}
  keySecret: ${RAZORPAY_KEY_SECRET:}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:}  #when verify webhooks
