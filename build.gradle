plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'in.ethiccode'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
}

// Task to copy React build to Spring Boot static resources
// Note: React is built by Heroku's Node.js buildpack via heroku-postbuild script
task copyFrontendBuild(type: Copy) {
    // Only copy if frontend/dist exists (built by Node.js buildpack)
    if (file('frontend/dist').exists()) {
        from 'frontend/dist'
        into 'src/main/resources/static'
        doFirst {
            file('src/main/resources/static').mkdirs()
        }
        println "Copying React build from frontend/dist to src/main/resources/static"
    } else {
        println "Warning: frontend/dist not found. React build may not be available."
        println "This is OK if building backend only, but frontend won't be served."
    }
}

// Make bootJar depend on frontend build copy
bootJar.dependsOn copyFrontendBuild

test {
    useJUnitPlatform()
}
